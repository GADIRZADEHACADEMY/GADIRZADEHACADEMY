<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadirzadeh Academy</title>
    
    <!-- BRAUZER SEKMESİNDƏKİ QIZILI LOQO (FAVICON) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' stroke='%23c5a880' stroke-width='8' fill='none'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23c5a880' font-size='32' font-family='Arial' font-weight='bold'%3EGA%3C/text%3E%3C/svg%3E">

    <style>
        /* SIFIRLAMA VƏ ƏSAS AYARLAR */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #e5e5e5;
            background-color: #0b0c10;
            overflow-x: hidden;
            width: 100%;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #0b0c10;
            padding: 15px;
            z-index: 1000;
            border-bottom: 1px solid #1f2833;
        }
        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-text {
            color: #c5a880;
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 15px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .nav-links a:hover {
            color: #c5a880;
        }
        
        /* HOME VİDEO BÖLMƏSİ */
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.75);
            z-index: -1;
        }
        .content {
            text-align: center;
            color: white;
            padding: 0 15px;
            width: 100%;
        }
        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #c5a880;
        }
        
        /* PREMIUM NEON PARLAYAN DÜYMƏ */
        .cta-btn {
            display: inline-block;
            padding: 14px 35px;
            font-size: 0.95rem;
            color: #0b0c10;
            background-color: #c5a880;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .cta-btn:hover {
            background-color: #ffffff;
            color: #0b0c10;
            box-shadow: 0 0 15px #c5a880, 0 0 30px #c5a880;
        }

        /* ÜMUMİ SEKSİYA AYARLARI */
        section {
            padding: 100px 15px 50px 15px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        section h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 45px;
            color: #ffffff;
            text-transform: uppercase;
        }
        section h2::after {
            content: '';
            display: block;
            width: 40px;
            height: 3px;
            background-color: #c5a880;
            margin: 10px auto 0 auto;
        }
        
        /* KURSLAR ŞƏBƏKƏSİ */
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }
        .card {
            background: #12141c;
            border: 1px solid #1f222e;
            padding: 30px;
            border-radius: 6px;
            width: 100%;
        }
        .card h3 {
            margin-bottom: 12px;
            color: #c5a880;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card p {
            color: #a4a7ab;
            font-size: 0.95rem;
            line-height: 1.7;
        }
        
        /* ENDİRİMLƏR */
        .discount-box {
            background: #12141c;
            border: 1px solid #c5a880;
            padding: 40px 20px;
            border-radius: 6px;
            text-align: center;
            width: 100%;
        }
        .discount-box h3 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .discount-box p {
            font-size: 1rem;
            margin-bottom: 25px;
            color: #a4a7ab;
        }
        .badge {
            display: inline-block;
            background-color: #c5a880;
            color: #0b0c10;
            padding: 8px 20px;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-radius: 4px;
        }
        
        /* HAQQIMIZDA */
        #about p {
            font-size: 1.1rem;
            text-align: center;
            color: #a4a7ab;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* ƏLAQƏ FORMASI VƏ ZƏRİF PARLAYAN DÜYMƏSİ */
        .contact-form {
            background: #12141c;
            border: 1px solid #1f222e;
            padding: 30px 20px;
            border-radius: 6px;
            width: 100%;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #c5a880;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            background-color: #0b0c10;
            border: 1px solid #1f222e;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #fff;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #c5a880;
        }
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #c5a880;
            color: #0b0c10;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            background-color: #ffffff;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(197, 168, 128, 0.6); /* Zərif parlama */
        }
        
        footer {
            background-color: #050507;
            color: #555;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            border-top: 1px solid #12141c;
            font-size: 0.8rem;
            width: 100%;
        }

        /* BÖYÜK EKRANLAR ÜÇÜN RESPONSIVE AYARLAR */
        @media (min-width: 768px) {
            .content h1 { font-size: 3.8rem; }
            .content p { font-size: 1.5rem; }
            section h2 { font-size: 2.4rem; }
            .grid-container {
                display: grid;
                grid-template-columns: repeat(3, 1fr); /* PC-də yan-yana 3 dənə */
            }
            .contact-form { padding: 40px; max-width: 600px; margin: 0 auto; }
            .discount-box { max-width: 800px; margin: 0 auto; }
        }

        /* MOBİL MOBİL MOBİL CİHAZLAR ÜÇÜN MENYU */
        @media (max-width: 480px) {
            .navbar {
                flex-direction: column;
                gap: 10px;
            }
            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
            header { padding: 10px; }
        }
    </style>
</head>

    <header>
        <nav class="navbar">
            <a href="#home" class="brand-logo">
