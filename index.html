<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Saytın sekme adı Gadirzadeh Academy olaraq təyin edildi -->
    <title>Gadirzadeh Academy</title>
    
    <!-- Brauzer sekmesindeki qlobusun yerinə lüks GA emblemini qoyan xüsusi kod (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' stroke='%23c5a880' stroke-width='8' fill='%230b0c10'/><text x='50%23' y='55%23' font-size='38' font-weight='bold' fill='%23c5a880' font-family='Arial' text-anchor='middle' dominant-baseline='middle'>GA</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth; /* Sürüşməni rəvan edən əsas mexanizm */
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #e5e5e5;
            background-color: #0b0c10;
            overflow-x: hidden;
            width: 100%;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #0b0c10;
            padding: 15px;
            z-index: 1000;
            border-bottom: 1px solid #1f2833;
        }
        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-text {
            color: #c5a880;
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 15px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .nav-links a:hover {
            color: #c5a880;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.7);
            z-index: -1;
        }
        .content {
            text-align: center;
            color: white;
            padding: 0 15px;
            width: 100%;
        }
        .content h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
        }
        .content p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #c5a880;
        }

        /* MAKSİMUM GÜCLÜ PARLAYAN "KURSLARI KƏŞF ET" DÜYMƏSİ */
        .cta-btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 0.9rem;
            color: #0b0c10;
            background-color: #c5a880;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .cta-btn:hover {
            background-color: #ffffff;
            color: #0b0c10;
            box-shadow: 0 0 15px #c5a880, 0 0 30px #c5a880; /* Qızılı güclü neon parlaqlığı */
        }

        section {
            padding: 80px 15px 40px 15px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        section h2 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 35px;
            color: #ffffff;
            text-transform: uppercase;
        }
        section h2::after {
            content: '';
            display: block;
            width: 40px;
            height: 3px;
            background-color: #c5a880;
            margin: 10px auto 0 auto;
        }
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }
        .card {
            background: #12141c;
            border: 1px solid #1f222e;
            padding: 25px;
            border-radius: 6px;
            width: 100%;
        }
        .card:hover {
            border-color: #c5a880;
        }
        .card h3 {
            margin-bottom: 10px;
            color: #c5a880;
            font-size: 1.2rem;
        }
        .card p {
            color: #a4a7ab;
            font-size: 0.9rem;
        }
        .discount-box {
            background: #12141c;
            border: 1px solid #c5a880;
            padding: 35px 15px;
            border-radius: 6px;
            text-align: center;
            width: 100%;
        }
        .discount-box h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .discount-box p {
            font-size: 0.95rem;
            margin-bottom: 20px;
            color: #a4a7ab;
        }
        .badge {
            display: inline-block;
            background-color: #c5a880;
            color: #0b0c10;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-radius: 4px;
        }
        #about p {
            font-size: 1rem;
            text-align: center;
            color: #a4a7ab;
        }
        .contact-form {
            background: #12141c;
            border: 1px solid #1f222e;
            padding: 25px 15px;
            border-radius: 6px;
            width: 100%;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #c5a880;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: #0b0c10;
            border: 1px solid #1f222e;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #fff;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #c5a880;
        }

        /* FORMANIN ZƏRİF PARLAYAN GÖNDƏR DÜYMƏSİ */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #c5a880;
            color: #0b0c10;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            background-color: #ffffff;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(197, 168, 128, 0.6); /* Zərif parlaqlıq */
        }

        footer {
            background-color: #050507;
            color: #555;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid #12141c;
            font-size: 0.75rem;
            width: 100%;
        }

        /* PC (BÖYÜK EKRAN) NİZAMLANMALARI */
        @media (min-width: 768px) {
            .content h1 { font-size: 3.5rem; }
            .content p { font-size: 1.4rem; }
            section h2 { font-size: 2.3rem; }
            .grid-container {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }
            .contact-form { padding: 40px; max-width: 600px; margin: 0 auto; }
            .discount-box { max-width: 800px; margin: 0 auto; }
        }

        /* MOBİL CİHAZLAR ÜÇÜN MENYU */
        @media (max-width: 480px) {
            .navbar {
                flex-direction: column;
                gap: 8px;
            }
            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
            header { padding: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#home" class="brand-logo">
                <!-- Loqonun solundakı premium GA emblemi -->
                <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://w3.org">
                    <circle cx="50" cy="50" r="46" stroke="#c5a880" stroke-width="6" fill="#0b0c10"/>
                    <text x="50%" y="55%" font-size="34" font-weight="200" fill="#c5a880" font-family='Times New Roman', serif text-anchor="middle" dominant-baseline="middle">GA</text>
                </svg>
                <span class="logo-text">Gadirzadeh Academy</span>
            </a>
            
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#courses">Kurslar</a></li>
                <li><a href="#discounts">Endirimlər</a></li>
                <li><a href="#about">Haqqımızda</a></li>
                <li><a href="#contact">Əlaqə</a></li>
            </ul>
        </nav>
    </header>

    <div id="home" class="video-container">
        <video autoplay muted loop class="background-video">
            <source src="https://cdn.pixabay.com/vimeo/76979871/pexels-76979871.mp4?width=1280&hash=3e1f5c8b6d9e2f7a1b8c9e5f6a7b8c9d" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"></div>
        <div class="content">
            <h1>Gadirzadeh Academy</h1>
            <p>Özünüzü inkişaf etdirin və gələcəyinizi qurun!</p>
            <a href="#courses" class="cta-btn">Kursları Kəşf Et</a>
        </div>
